name: tv
description: "TV WebApp for the Teamfit interactive fitness platform"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you want to publish your package to pub.dev.

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number specified after a +.
# Both the version and the builder number can be overridden from the command line using the --build-name
# and --build-number flags.
# For more information, see
# https://dart.dev/tools/public-versioning

version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify packages that provide functions to implement parts of
# your program.
#
# The pub.dev site lists all available packages and their version,
# as well as description, view code, license information, and more.
# Consider using the following search: https://pub.dev/search?q=

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  supabase: ^2.16.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  intl: ^0.20.3
  flutter_dotenv: ^6.0.1

  # Erzeugung des QR-Codes für den Deep-Link auf T1 (TV-spezifisch).
  qr_flutter: ^4.1.0
  flutter_svg: ^2.1.0
  google_fonts: ^6.2.1
  wakelock_plus: ^1.7.0
  clock: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices in Flutter applications.
  flutter_lints: ^6.0.0

  # Simulierte Zeit für Bloc-Tests (Timer ohne echte Wartezeit).
  fake_async: ^1.3.0
  test: ^1.30.0

# For information on the general product state structure, see
# https://dart.dev/guides/library/structural

# The section below is for specifying Flutter-specific aspects of the package.

flutter:
  # This section identifies your Flutter project as a frontend app for
  # specific platforms.

  # The following line ensures that the Material Icons font is
  # included with your application, so you can use icons in the
  # material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - .env

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
